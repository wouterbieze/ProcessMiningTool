const { useMemo, useState } = React;

/* ---------------------------------------------------------------
   DATA GENERATION — dummy order-to-cash event log (100 cases)
--------------------------------------------------------------- */

function mulberry32(seed) {
  return function () {
    seed |= 0;
    seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(20260811);
const pick = (arr) => arr[Math.floor(rand() * arr.length)];
const weightedPick = (options) => {
  const total = options.reduce((s, o) => s + o[1], 0);
  let r = rand() * total;
  for (const [val, w] of options) {
    if (r < w) return val;
    r -= w;
  }
  return options[options.length - 1][0];
};
const randRange = (min, max) => min + rand() * (max - min);

const DEMO_META = {
  "Create Order": { level: 0, type: "start", resource: "Sales Team", dur: [0, 1] },
  "Check Credit": { level: 1, type: "normal", resource: "Credit Dept", dur: [1, 6] },
  "Check Stock": { level: 2, type: "normal", resource: "Warehouse", dur: [1, 4] },
  "Reject Order": { level: 2, type: "end-bad", resource: "Credit Dept", dur: [0, 1] },
  "Pick Items": { level: 3, type: "normal", resource: "Warehouse", dur: [2, 10] },
  "Backorder Item": { level: 3, type: "exception", resource: "Warehouse", dur: [12, 72] },
  "Rework Order": { level: 4, type: "exception", resource: "Warehouse", dur: [4, 24] },
  "Cancel Order": { level: 4, type: "end-bad", resource: "Sales Team", dur: [0, 2] },
  "Pack Items": { level: 5, type: "normal", resource: "Warehouse", dur: [1, 4] },
  "Ship Goods": { level: 6, type: "normal", resource: "Logistics", dur: [4, 12] },
  "Create Invoice": { level: 7, type: "normal", resource: "Finance", dur: [0, 2] },
  "Send Invoice": { level: 8, type: "normal", resource: "Finance", dur: [0, 1] },
  "Receive Payment": { level: 9, type: "normal", resource: "Finance", dur: [24, 120] },
  "Deliver Order": { level: 10, type: "normal", resource: "Logistics", dur: [24, 96] },
  "Return Goods": { level: 11, type: "exception", resource: "Customer Service", dur: [24, 72] },
  "Issue Refund": { level: 12, type: "exception", resource: "Finance", dur: [4, 24] },
  "Close Order": { level: 13, type: "end-good", resource: "Sales Team", dur: [0, 1] },
};

const TRANSITIONS = {
  "Create Order": [["Check Credit", 1]],
  "Check Credit": [
    ["Check Stock", 0.85],
    ["Reject Order", 0.15],
  ],
  "Reject Order": [],
  "Check Stock": [
    ["Pick Items", 0.8],
    ["Backorder Item", 0.2],
  ],
  "Backorder Item": [
    ["Pick Items", 0.85],
    ["Cancel Order", 0.15],
  ],
  "Cancel Order": [],
  "Pick Items": [
    ["Pack Items", 0.92],
    ["Rework Order", 0.08],
  ],
  "Rework Order": [["Pick Items", 1]],
  "Pack Items": [["Ship Goods", 1]],
  "Ship Goods": [["Create Invoice", 1]],
  "Create Invoice": [["Send Invoice", 1]],
  "Send Invoice": [
    ["Receive Payment", 0.88],
    ["Send Invoice", 0.12],
  ],
  "Receive Payment": [["Deliver Order", 1]],
  "Deliver Order": [
    ["Close Order", 0.9],
    ["Return Goods", 0.1],
  ],
  "Return Goods": [["Issue Refund", 1]],
  "Issue Refund": [["Close Order", 1]],
  "Close Order": [],
};

function generateCase(caseId, startTime) {
  const trace = [];
  let current = "Create Order";
  let t = startTime;
  let reminderCount = 0;
  let guard = 0;
  while (current && guard < 25) {
    guard++;
    const [min, max] = DEMO_META[current].dur;
    trace.push({ activity: current, timestamp: new Date(t), resource: DEMO_META[current].resource });
    t += randRange(min, max) * 3600 * 1000;

    if (!TRANSITIONS[current] || TRANSITIONS[current].length === 0) break;

    let next = weightedPick(TRANSITIONS[current]);
    if (current === "Send Invoice" && next === "Send Invoice") {
      reminderCount++;
      if (reminderCount > 2) next = "Receive Payment";
    }
    current = next;
  }
  return trace.map((e, i) => ({
    caseId,
    index: i,
    activity: e.activity,
    timestamp: e.timestamp,
    resource: e.resource,
  }));
}

function buildLog() {
  const now = new Date("2026-08-11T09:00:00");
  const cases = [];
  for (let i = 0; i < 100; i++) {
    const caseId = `ORD-${1000 + i}`;
    const startOffsetDays = randRange(1, 55);
    const start = now.getTime() - startOffsetDays * 24 * 3600 * 1000;
    cases.push({ caseId, events: generateCase(caseId, start) });
  }
  return cases;
}

/* ---------------------------------------------------------------
   GENERIC META — computed for any uploaded event log, since a
   real log's activity names/levels/types aren't known up front
--------------------------------------------------------------- */

const NEGATIVE_KEYWORDS = ["reject", "cancel", "decline", "abort", "fail", "deny", "denied", "refuse", "withdraw", "void"];

function computeGenericMeta(cases) {
  const activities = new Set();
  const isFirst = new Set();
  const isLast = new Set();
  const outgoing = {};

  cases.forEach((c) => {
    const acts = c.events.map((e) => e.activity);
    acts.forEach((a) => activities.add(a));
    if (acts.length) {
      isFirst.add(acts[0]);
      isLast.add(acts[acts.length - 1]);
    }
    for (let i = 0; i < acts.length - 1; i++) {
      (outgoing[acts[i]] = outgoing[acts[i]] || new Set()).add(acts[i + 1]);
    }
  });

  // multi-source BFS from start activities -> level = shortest distance from any start
  const level = {};
  const queue = [];
  isFirst.forEach((a) => {
    if (level[a] === undefined) {
      level[a] = 0;
      queue.push(a);
    }
  });
  if (queue.length === 0 && activities.size > 0) {
    const a0 = activities.values().next().value;
    level[a0] = 0;
    queue.push(a0);
  }
  let qi = 0;
  while (qi < queue.length) {
    const cur = queue[qi++];
    const nexts = outgoing[cur];
    if (!nexts) continue;
    nexts.forEach((n) => {
      if (level[n] === undefined) {
        level[n] = level[cur] + 1;
        queue.push(n);
      }
    });
  }
  const maxAssigned = Math.max(0, ...Object.values(level));
  activities.forEach((a) => {
    if (level[a] === undefined) level[a] = maxAssigned + 1;
  });

  // detect loop/rework participants: any edge a->b where b's level doesn't move forward
  const backEdgeActivities = new Set();
  cases.forEach((c) => {
    const acts = c.events.map((e) => e.activity);
    for (let i = 0; i < acts.length - 1; i++) {
      const a = acts[i];
      const b = acts[i + 1];
      if (level[b] <= level[a]) {
        backEdgeActivities.add(a);
        backEdgeActivities.add(b);
      }
    }
  });

  const meta = {};
  activities.forEach((a) => {
    const first = isFirst.has(a);
    const last = isLast.has(a);
    let type;
    if (last) {
      const lower = a.toLowerCase();
      const negative = NEGATIVE_KEYWORDS.some((kw) => lower.includes(kw));
      type = negative ? "end-bad" : "end-good";
    } else if (first) {
      type = "start";
    } else if (backEdgeActivities.has(a)) {
      type = "exception";
    } else {
      type = "normal";
    }
    meta[a] = { level: level[a], type };
  });
  return meta;
}

/* ---------------------------------------------------------------
   XES PARSING — for uploaded real event logs
--------------------------------------------------------------- */

const MAX_IMPORTED_CASES = 3000;

function parseXES(xmlText) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(xmlText, "application/xml");
  if (doc.querySelector("parsererror")) {
    throw new Error("This file doesn't look like valid XML/XES. Please check the file and try again.");
  }

  const traceEls = Array.from(doc.getElementsByTagName("trace"));
  if (traceEls.length === 0) {
    throw new Error("No <trace> elements found — this doesn't look like a valid XES event log.");
  }

  const ATTR_TAGS = new Set(["string", "date", "int", "float", "boolean", "id"]);
  const getAttrs = (el) => {
    const attrs = {};
    for (const child of el.children) {
      const tag = child.tagName.toLowerCase();
      if (ATTR_TAGS.has(tag)) {
        const key = child.getAttribute("key");
        const value = child.getAttribute("value");
        if (key) attrs[key] = value;
      }
    }
    return attrs;
  };

  let cases = [];
  traceEls.forEach((traceEl, idx) => {
    const traceAttrs = getAttrs(traceEl);
    const caseId = traceAttrs["concept:name"] || `Case ${idx + 1}`;
    const eventEls = Array.from(traceEl.getElementsByTagName("event"));
    let events = eventEls.map((evEl) => {
      const a = getAttrs(evEl);
      return {
        activity: a["concept:name"] || "Unknown",
        timestamp: a["time:timestamp"] ? new Date(a["time:timestamp"]) : null,
        resource: a["org:resource"] || null,
        lifecycle: a["lifecycle:transition"] || null,
      };
    });

    // if lifecycle info is present, keep only "complete" events to avoid double-counting
    // start/complete pairs of the same activity as separate directly-follows steps
    const hasLifecycle = events.some((e) => e.lifecycle);
    if (hasLifecycle) {
      const completes = events.filter((e) => e.lifecycle && e.lifecycle.toLowerCase() === "complete");
      if (completes.length > 0) events = completes;
    }

    events = events.filter((e) => e.timestamp && !Number.isNaN(e.timestamp.getTime()));
    events.sort((a, b) => a.timestamp - b.timestamp);
    events = events.map((e, i) => ({ ...e, index: i }));

    if (events.length > 0) {
      cases.push({ caseId: String(caseId), events });
    }
  });

  if (cases.length === 0) {
    throw new Error("No cases with valid timestamped events were found in this file.");
  }

  let truncated = false;
  if (cases.length > MAX_IMPORTED_CASES) {
    cases = cases.slice(0, MAX_IMPORTED_CASES);
    truncated = true;
  }

  return { cases, truncated, totalCasesInFile: traceEls.length };
}

/* ---------------------------------------------------------------
   ANALYSIS HELPERS
--------------------------------------------------------------- */

const avg = (arr) => (arr.length ? arr.reduce((s, v) => s + v, 0) / arr.length : undefined);

function fmtDur(hours) {
  if (hours === undefined || hours === null || Number.isNaN(hours)) return "–";
  if (hours < 1) return `${Math.round(hours * 60)}m`;
  if (hours < 48) return `${hours.toFixed(1)}h`;
  return `${(hours / 24).toFixed(1)}d`;
}

function analyze(cases, meta) {
  const events = cases.flatMap((c) => c.events);
  const nodeFreq = {};
  const edgeFreq = {};
  const nodeDurSamples = {};
  const edgeDurSamples = {};
  const durations = [];
  let endGoodCount = 0;
  let endBadCount = 0;

  cases.forEach((c) => {
    const acts = c.events.map((e) => e.activity);
    acts.forEach((a) => (nodeFreq[a] = (nodeFreq[a] || 0) + 1));
    for (let i = 0; i < acts.length - 1; i++) {
      const key = acts[i] + "→" + acts[i + 1];
      edgeFreq[key] = (edgeFreq[key] || 0) + 1;
      const deltaH = (c.events[i + 1].timestamp.getTime() - c.events[i].timestamp.getTime()) / (3600 * 1000);
      (edgeDurSamples[key] = edgeDurSamples[key] || []).push(deltaH);
      (nodeDurSamples[acts[i]] = nodeDurSamples[acts[i]] || []).push(deltaH);
    }
    const first = c.events[0].timestamp.getTime();
    const last = c.events[c.events.length - 1].timestamp.getTime();
    durations.push((last - first) / (3600 * 1000));
    const last_act = acts[acts.length - 1];
    const lastType = meta[last_act] ? meta[last_act].type : null;
    if (lastType === "end-good") endGoodCount++;
    else if (lastType === "end-bad") endBadCount++;
  });

  const nodeAvgDur = {};
  Object.entries(nodeDurSamples).forEach(([k, v]) => (nodeAvgDur[k] = avg(v)));
  const edgeAvgDur = {};
  Object.entries(edgeDurSamples).forEach(([k, v]) => (edgeAvgDur[k] = avg(v)));

  const variantMap = {};
  cases.forEach((c) => {
    const acts = c.events.map((e) => e.activity);
    const key = acts.join(" → ");
    if (!variantMap[key]) {
      variantMap[key] = { key, count: 0, steps: acts, edgeDurSamples: {}, nodeDurSamples: {} };
    }
    const v = variantMap[key];
    v.count++;
    for (let i = 0; i < acts.length - 1; i++) {
      const ek = acts[i] + "→" + acts[i + 1];
      const deltaH = (c.events[i + 1].timestamp.getTime() - c.events[i].timestamp.getTime()) / (3600 * 1000);
      (v.edgeDurSamples[ek] = v.edgeDurSamples[ek] || []).push(deltaH);
      (v.nodeDurSamples[acts[i]] = v.nodeDurSamples[acts[i]] || []).push(deltaH);
    }
  });

  const variants = Object.values(variantMap)
    .map((v) => {
      const edgeFreqInStep = {};
      const nodeFreqInStep = {};
      v.steps.forEach((s) => (nodeFreqInStep[s] = (nodeFreqInStep[s] || 0) + 1));
      for (let i = 0; i < v.steps.length - 1; i++) {
        const ek = v.steps[i] + "→" + v.steps[i + 1];
        edgeFreqInStep[ek] = (edgeFreqInStep[ek] || 0) + 1;
      }
      const vNodeFreq = {};
      Object.entries(nodeFreqInStep).forEach(([k, c]) => (vNodeFreq[k] = c * v.count));
      const vEdgeFreq = {};
      Object.entries(edgeFreqInStep).forEach(([k, c]) => (vEdgeFreq[k] = c * v.count));
      const vNodeAvgDur = {};
      Object.entries(v.nodeDurSamples).forEach(([k, arr]) => (vNodeAvgDur[k] = avg(arr)));
      const vEdgeAvgDur = {};
      Object.entries(v.edgeDurSamples).forEach(([k, arr]) => (vEdgeAvgDur[k] = avg(arr)));
      return {
        key: v.key,
        count: v.count,
        steps: v.steps,
        nodeFreq: vNodeFreq,
        edgeFreq: vEdgeFreq,
        nodeAvgDur: vNodeAvgDur,
        edgeAvgDur: vEdgeAvgDur,
      };
    })
    .sort((a, b) => b.count - a.count);

  const avgDuration = durations.reduce((s, d) => s + d, 0) / durations.length;
  const avgEvents = events.length / cases.length;

  return {
    events,
    nodeFreq,
    edgeFreq,
    nodeAvgDur,
    edgeAvgDur,
    variants,
    avgDuration,
    avgEvents,
    totalEvents: events.length,
    totalCases: cases.length,
    completionRate: (endGoodCount / cases.length) * 100,
    exceptionRate: (endBadCount / cases.length) * 100,
  };
}

/* ---------------------------------------------------------------
   PROCESS MAP LAYOUT
--------------------------------------------------------------- */

const NODE_W = 138;
const NODE_H = 54;
const COL_GAP = 168;
const ROW_GAP = 118;

function computeLayout(meta) {
  const levelGroups = {};
  Object.entries(meta).forEach(([name, m]) => {
    levelGroups[m.level] = levelGroups[m.level] || [];
    levelGroups[m.level].push(name);
  });
  const levels = Object.keys(levelGroups).map(Number);
  const maxLevel = levels.length ? Math.max(...levels) : 0;
  const maxPerLevel = Math.max(1, ...Object.values(levelGroups).map((a) => a.length));
  const canvasH = maxPerLevel * ROW_GAP + 160;
  const canvasW = (maxLevel + 1) * COL_GAP + 80;

  const nodePos = (name) => {
    const m = meta[name];
    if (!m) return { x: 70, y: canvasH / 2 };
    const group = levelGroups[m.level];
    const idx = group.indexOf(name);
    const n = group.length;
    const x = 70 + m.level * COL_GAP;
    const centerY = canvasH / 2;
    const y = centerY - ((n - 1) * ROW_GAP) / 2 + idx * ROW_GAP;
    return { x, y };
  };

  const computeViewBox = (visibleNodes) => {
    if (!visibleNodes) return { x: 0, y: 0, w: canvasW, h: canvasH };
    const lvls = [...visibleNodes].map((n) => (meta[n] ? meta[n].level : 0));
    const minL = Math.min(...lvls);
    const maxL = Math.max(...lvls);
    const x = 70 + minL * COL_GAP - 60;
    const w = (maxL - minL) * COL_GAP + NODE_W + 130;
    return { x, y: 0, w, h: canvasH };
  };

  return { levelGroups, maxLevel, maxPerLevel, canvasW, canvasH, nodePos, computeViewBox };
}

const TYPE_COLOR = {
  start: { fill: "var(--type-start-fill)", stroke: "var(--type-start-stroke)", text: "var(--type-start-text)" },
  normal: { fill: "var(--type-normal-fill)", stroke: "var(--type-normal-stroke)", text: "var(--type-normal-text)" },
  exception: { fill: "var(--type-exception-fill)", stroke: "var(--type-exception-stroke)", text: "var(--type-exception-text)" },
  "end-bad": { fill: "var(--type-endbad-fill)", stroke: "var(--type-endbad-stroke)", text: "var(--type-endbad-text)" },
  "end-good": { fill: "var(--type-endgood-fill)", stroke: "var(--type-endgood-stroke)", text: "var(--type-endgood-text)" },
};

function safeId(key) {
  return "edge-" + key.replace(/[^a-zA-Z0-9]/g, "-");
}

function metricColor(ratio) {
  // teal (fast) → amber → red (slow/bottleneck)
  const stops = [
    [45, 212, 191],
    [232, 162, 58],
    [224, 96, 124],
  ];
  const t = Math.max(0, Math.min(1, ratio)) * (stops.length - 1);
  const i = Math.min(stops.length - 2, Math.floor(t));
  const f = t - i;
  const c1 = stops[i];
  const c2 = stops[i + 1];
  const r = Math.round(c1[0] + (c2[0] - c1[0]) * f);
  const g = Math.round(c1[1] + (c2[1] - c1[1]) * f);
  const bl = Math.round(c1[2] + (c2[2] - c1[2]) * f);
  return `rgb(${r}, ${g}, ${bl})`;
}

function edgePathAndLabel(a, b, value, maxValue, meta, layout) {
  const p1 = layout.nodePos(a);
  const p2 = layout.nodePos(b);
  const isSelf = a === b;
  const forward = meta[b].level > meta[a].level;
  const x1 = p1.x + NODE_W;
  const y1 = p1.y;
  const x2 = p2.x;
  const y2 = p2.y;
  const ratio = maxValue > 0 ? value / maxValue : 0;
  const strokeW = 1.4 + ratio * 6.5;

  if (isSelf) {
    const d = `M ${p1.x + NODE_W * 0.28} ${p1.y - NODE_H / 2}
      C ${p1.x + NODE_W * 0.1} ${p1.y - NODE_H - 34}, ${p1.x + NODE_W * 0.9} ${p1.y - NODE_H - 34}, ${p1.x + NODE_W * 0.72} ${p1.y - NODE_H / 2}`;
    return { d, strokeW, ratio, labelX: p1.x + NODE_W / 2, labelY: p1.y - NODE_H - 30 };
  }
  if (forward) {
    const midX = (x1 + x2) / 2;
    const d = `M ${x1} ${y1} C ${midX} ${y1}, ${midX} ${y2}, ${x2} ${y2}`;
    return { d, strokeW, ratio, labelX: midX, labelY: (y1 + y2) / 2 };
  }
  // backward / same-level loop edge — arc below
  const bulge = 90 + Math.abs(meta[a].level - meta[b].level) * 4;
  const sx = p1.x + NODE_W / 2;
  const sy = p1.y + NODE_H / 2;
  const tx = p2.x + NODE_W / 2;
  const ty = p2.y + NODE_H / 2;
  const midX = (sx + tx) / 2;
  const d = `M ${sx} ${sy} C ${sx} ${sy + bulge}, ${tx} ${ty + bulge}, ${tx} ${ty}`;
  return { d, strokeW, ratio, labelX: midX, labelY: Math.max(sy, ty) + bulge * 0.72 };
}

    </button>

function ProcessMap({
  meta,
  layout,
  nodeFreq,
  edgeFreq,
  nodeAvgDur,
  edgeAvgDur,
  metric = "count",
  selected,
  setSelected,
  visibleNodes,
  visibleEdges,
  animate = false,
}) {
  const nodeNames = visibleNodes ? Object.keys(meta).filter((n) => visibleNodes.has(n)) : Object.keys(meta);
  const edgeEntries = visibleEdges
    ? Object.entries(edgeFreq).filter(([k]) => visibleEdges.has(k))
    : Object.entries(edgeFreq);

  const edgeMetricMap = metric === "count" ? edgeFreq : edgeAvgDur;
  const nodeMetricMap = metric === "count" ? nodeFreq : nodeAvgDur;
  const edgeVals = edgeEntries.map(([k]) => edgeMetricMap[k]).filter((v) => typeof v === "number" && !Number.isNaN(v));
  const nodeVals = nodeNames.map((n) => nodeMetricMap[n]).filter((v) => typeof v === "number" && !Number.isNaN(v));
  const maxEdgeVal = edgeVals.length ? Math.max(...edgeVals) : 1;
  const maxNodeVal = nodeVals.length ? Math.max(...nodeVals) : 1;
  const maxNodeFreq = Math.max(...nodeNames.map((n) => nodeFreq[n] || 0), 1);

  const relatedEdges = (name) => {
    if (!name) return null;
    const s = new Set();
    edgeEntries.forEach(([k]) => {
      const [a, b] = k.split("→");
      if (a === name || b === name) s.add(k);
    });
    return s;
  };
  const rel = relatedEdges(selected);
  const vb = layout.computeViewBox(visibleNodes);

  return (
    <div className="map-scroll">
      <svg width={vb.w} height={vb.h} viewBox={`${vb.x} ${vb.y} ${vb.w} ${vb.h}`} className="map-svg">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill={metric === "count" ? "var(--amber)" : "var(--teal)"} />
          </marker>
          <marker id="arrowDim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--edge-dim)" />
          </marker>
        </defs>

        {edgeEntries.map(([key, freqWeight]) => {
          const [a, b] = key.split("→");
          const value = metric === "count" ? freqWeight : edgeAvgDur[key];
          const { d, strokeW, ratio, labelX, labelY } = edgePathAndLabel(a, b, value || 0, maxEdgeVal, meta, layout);
          const label = metric === "count" ? String(freqWeight) : fmtDur(edgeAvgDur[key]);
          const dim = rel && !rel.has(key);
          const strokeColor = dim ? "var(--edge-dim)" : metric === "count" ? "var(--amber)" : metricColor(ratio);
          const pathId = safeId(key);
          const dotDur = Math.max(1.3, 5.4 - ratio * 3.8);
          return (
            <g key={key} opacity={dim ? 0.18 : 1}>
              <path
                id={pathId}
                d={d}
                fill="none"
                stroke={strokeColor}
                strokeWidth={strokeW}
                markerEnd={dim ? "url(#arrowDim)" : "url(#arrow)"}
              />
              {animate && !dim && (
                <circle r={Math.min(4.2, 2.4 + strokeW * 0.25)} fill={strokeColor}>
                  <animateMotion dur={`${dotDur}s`} repeatCount="indefinite">
                    <mpath href={`#${pathId}`} />
                  </animateMotion>
                </circle>
              )}
              <rect
                x={labelX - 13}
                y={labelY - 10}
                width={label.length * 8 + 10}
                height="18"
                rx="4"
                fill="var(--panel-2)"
                stroke={dim ? "var(--border)" : strokeColor}
                strokeWidth="1"
              />
              <text x={labelX - 8} y={labelY + 3} fontSize="11" fill={dim ? "var(--muted)" : "var(--amber-soft)"} fontFamily="var(--mono)">
                {label}
              </text>
            </g>
          );
        })}

        {nodeNames.map((name) => {
          const { x, y } = layout.nodePos(name);
          const colors = TYPE_COLOR[meta[name].type];
          const freq = nodeFreq[name] || 0;
          const isSel = selected === name;
          const dim = selected && !isSel && rel && !rel.has(name);
          const subtitle =
            metric === "count"
              ? `${freq} inst · ${((freq / maxNodeFreq) * 100).toFixed(0)}% peak`
              : nodeAvgDur[name] !== undefined
              ? `${fmtDur(nodeAvgDur[name])} avg step`
              : "end of process";
          return (
            <g
              key={name}
              transform={`translate(${x}, ${y - NODE_H / 2})`}
              onClick={() => setSelected(isSel ? null : name)}
              style={{ cursor: "pointer" }}
              opacity={dim ? 0.35 : 1}
            >
              <rect
                width={NODE_W}
                height={NODE_H}
                rx="9"
                fill={colors.fill}
                stroke={isSel ? "var(--amber-soft)" : colors.stroke}
                strokeWidth={isSel ? 2.5 : 1.4}
              />
              <text x={NODE_W / 2} y={22} textAnchor="middle" fontSize="12.5" fontWeight="600" fill={colors.text} fontFamily="var(--body)">
                {name}
              </text>
              <text x={NODE_W / 2} y={39} textAnchor="middle" fontSize="10.5" fill="var(--muted)" fontFamily="var(--mono)">
                {subtitle}
              </text>
            </g>
          );
        })}
      </svg>
    </div>
  );
}

      </div>

              </div>

function EventLogView({ cases, meta }) {
  const [query, setQuery] = useState("");
  const filtered = useMemo(() => {
    if (!query.trim()) return cases;
    const q = query.trim().toLowerCase();
    return cases.filter((c) => c.caseId.toLowerCase().includes(q));
  }, [cases, query]);

  const downloadCsv = () => {
    const rows = [["case_id", "event_index", "activity", "timestamp", "resource"]];
    cases.forEach((c) =>
      c.events.forEach((e) =>
        rows.push([c.caseId, e.index, e.activity, e.timestamp.toISOString(), e.resource])
      )
    );
    const csv = rows.map((r) => r.map((v) => `"${v}"`).join(",")).join("\n");
    const blob = new Blob([csv], { type: "text/csv" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "process_mining_event_log.csv";
    a.click();
    URL.revokeObjectURL(url);
  };

  return (
    <div className="log-wrap">
      <div className="log-toolbar">
        <input
          className="log-search"
          placeholder="Filter by case ID, e.g. ORD-1004"
          value={query}
          onChange={(e) => setQuery(e.target.value)}
        />
        <button className="log-export" onClick={downloadCsv}>
          ⬇ Export CSV
        </button>
      </div>
      <div className="log-table-scroll">
        <table className="log-table">
          <thead>
            <tr>
              <th>Case ID</th>
              <th>#</th>
              <th>Activity</th>
              <th>Timestamp</th>
              <th>Resource</th>
            </tr>
          </thead>
          <tbody>
            {filtered.map((c) =>
              c.events.map((e) => (
                <tr key={c.caseId + e.index}>
                  <td className="mono">{c.caseId}</td>
                  <td className="mono dim">{e.index + 1}</td>
                  <td>
                    <span className={`trace-chip small type-${meta[e.activity].type}`}>{e.activity}</span>
                  </td>
                  <td className="mono dim">
                    {e.timestamp.toLocaleString(undefined, {
                      month: "short",
                      day: "2-digit",
                      hour: "2-digit",
                      minute: "2-digit",
                    })}
                  </td>
                  <td className="dim">{e.resource}</td>
                </tr>
              ))
            )}
          </tbody>
        </table>
      </div>
      <div className="log-footnote">
        Showing {filtered.reduce((s, c) => s + c.events.length, 0)} events across {filtered.length} case(s)
      </div>
    </div>
  );
}

function ActivityFrequency({ analysis, meta }) {
  const entries = Object.entries(analysis.nodeFreq).sort((a, b) => b[1] - a[1]);

  return (
    <div className="freq-list">
      {entries.map(([name, count]) => (
        <div className="freq-row" key={name}>
          <span className={`freq-name type-${meta[name].type}`}>{name}</span>
          <div className="freq-track">
            <div className="freq-fill" style={{ width: `${(count / max) * 100}%` }} />

          <span className="freq-count mono">{count}</span>

}

function CaseViewerView({ cases, analysis, meta }) {
  const [query, setQuery] = useState("");
  const [selectedId, setSelectedId] = useState(cases[0] ? cases[0].caseId : null);

  const filteredList = useMemo(() => {
    if (!query.trim()) return cases;
    const q = query.trim().toLowerCase();
    return cases.filter((c) => c.caseId.toLowerCase().includes(q));
  }, [cases, query]);

  const selectedCase = cases.find((c) => c.caseId === selectedId) || cases[0];

  if (!selectedCase) {
    return <div className="empty-state">No cases match the current filters.</div>;
  }

  const events = selectedCase.events;
  const traceKey = events.map((e) => e.activity).join(" → ");
  const variantIdx = analysis.variants.findIndex((v) => v.key === traceKey);
  const variant = variantIdx >= 0 ? analysis.variants[variantIdx] : null;
  const totalHours = (events[events.length - 1].timestamp.getTime() - events[0].timestamp.getTime()) / (3600 * 1000);

  return (
    <div className="case-viewer">
      <div className="case-list-panel">
        <input
          className="case-list-search"
          placeholder="Search case ID…"
          value={query}
          onChange={(e) => setQuery(e.target.value)}
        />
        <div className="case-list">
          {filteredList.map((c) => (
            <button
              key={c.caseId}
              className={`case-list-item ${c.caseId === selectedCase.caseId ? "active" : ""}`}
              onClick={() => setSelectedId(c.caseId)}
            >
              <span>{c.caseId}</span>
              <span>{c.events.length} steps</span>
            </button>
          ))}
        </div>
      </div>

      <div className="case-detail">
        <div className="case-detail-head">
          <div>
            <h3>{selectedCase.caseId}</h3>
            <div className="case-variant-badge">
              {variant
                ? variant.count === 1
                  ? "Unique trace — no other case follows this exact path"
                  : `Follows variant #${variantIdx + 1} · shared with ${variant.count - 1} other case(s) · ${((variant.count / analysis.totalCases) * 100).toFixed(0)}% of cases`
                : "Trace not found in current variant set"}
            </div>
          </div>
          <div className="case-kpis">
            <div><span className="n">{events.length}</span><span className="l">Steps</span></div>
            <div><span className="n">{fmtDur(totalHours)}</span><span className="l">Total time</span></div>
          </div>
        </div>

        <div className="case-timeline">
          {events.map((e, i) => {
            const colors = TYPE_COLOR[meta[e.activity].type];
            const next = events[i + 1];
            const gapH = next ? (next.timestamp.getTime() - e.timestamp.getTime()) / (3600 * 1000) : null;
            return (
              <React.Fragment key={i}>
                <div className="tl-row">
                  <div className="tl-dot" style={{ background: colors.stroke }} />
                  <div className="tl-content">
                    <div className="tl-activity" style={{ color: colors.text }}>
                      {e.activity}
                    </div>
                    <div className="tl-meta">
                      {e.timestamp.toLocaleString(undefined, {
                        month: "short",
                        day: "2-digit",
                        hour: "2-digit",
                        minute: "2-digit",
                      })}{" "}
                      · {e.resource}
                    </div>
                  </div>
                </div>
                {gapH !== null && <div className="tl-gap">↓ {fmtDur(gapH)} later</div>}
              </React.Fragment>
            );
          })}
        </div>
      </div>
    </div>
  );
}

function ProcessMiningExplorer() {
  const demoCases = useMemo(() => buildLog(), []);
  const [tab, setTab] = useState("overview");
  const [selectedNode, setSelectedNode] = useState(null);
  const [mapMetric, setMapMetric] = useState("count");
  const [theme, setTheme] = useState("dark");
  const [animate, setAnimate] = useState(true);
  const [activityFilter, setActivityFilter] = useState(() => new Set());

  const [dataSource, setDataSource] = useState("demo"); // 'demo' | 'custom'
  const [customCases, setCustomCases] = useState(null);
  const [fileName, setFileName] = useState(null);
  const [xesWarning, setXesWarning] = useState(null);
  const [xesError, setXesError] = useState(null);
  const [xesLoading, setXesLoading] = useState(false);

  const cases = dataSource === "custom" && customCases ? customCases : demoCases;

  const activeMeta = useMemo(() => {
    return dataSource === "custom" && customCases ? computeGenericMeta(customCases) : DEMO_META;
  }, [dataSource, customCases]);

  const layout = useMemo(() => computeLayout(activeMeta), [activeMeta]);

  const allActivities = Object.keys(activeMeta);

  const handleFileSelect = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    setXesLoading(true);
    setXesError(null);
    setXesWarning(null);
    const reader = new FileReader();
    reader.onload = (evt) => {
      try {
        const { cases: parsed, truncated, totalCasesInFile } = parseXES(evt.target.result);
        setCustomCases(parsed);
        setFileName(file.name);
        setDataSource("custom");
        setActivityFilter(new Set());
        setSelectedNode(null);
        setTab("overview");
        if (truncated) {
          setXesWarning(
            `This log has ${totalCasesInFile} cases — showing the first ${MAX_IMPORTED_CASES} for performance.`
          );
        }
      } catch (err) {
        setXesError(err.message || "Couldn't parse this file.");
      } finally {
        setXesLoading(false);
      }
    };
    reader.onerror = () => {
      setXesError("Couldn't read this file.");
      setXesLoading(false);
    };
    reader.readAsText(file);
    e.target.value = ""; // allow re-selecting the same file later
  };

  const handleLoadDemo = () => {
    setDataSource("demo");
    setCustomCases(null);
    setFileName(null);
    setXesWarning(null);
    setXesError(null);
    setActivityFilter(new Set());
    setSelectedNode(null);
    setTab("overview");
  };

  const toggleActivity = (name) => {
    setActivityFilter((prev) => {
      const next = new Set(prev);
      if (next.has(name)) next.delete(name);
      else next.add(name);
      return next;
    });
  };
  const clearFilter = () => setActivityFilter(new Set());

  const filteredCases = useMemo(() => {
    if (activityFilter.size === 0) return cases;
    return cases.filter((c) => {
      const acts = new Set(c.events.map((e) => e.activity));
      return [...activityFilter].every((a) => acts.has(a));
    });
  }, [cases, activityFilter]);

  const analysis = useMemo(() => analyze(filteredCases, activeMeta), [filteredCases, activeMeta]);

  const tabs = [
    { id: "overview", label: "Overview" },
    { id: "map", label: "Process Map" },
    { id: "variants", label: "Variants" },
    { id: "cases", label: "Case Viewer" },
    { id: "log", label: "Event Log" },
  ];

  const dataSourceBar = (
    <DataSourceBar
      dataSource={dataSource}
      fileName={fileName}
      caseCount={cases.length}
      warning={xesWarning}
      error={xesError}
      onFileSelect={handleFileSelect}
      onLoadDemo={handleLoadDemo}
      loading={xesLoading}
    />
  );

  if (filteredCases.length === 0) {
    return (
      <div className={`pm-root theme-${theme}`}>
        <style>{`.pm-root.theme-${theme} { background: ${theme === "dark" ? "#0b1220" : "#f4f6fb"}; color: ${theme === "dark" ? "#e6edf5" : "#17202e"}; min-height: 100vh; padding: 40px; font-family: system-ui, sans-serif; }`}</style>
        {dataSourceBar}
        <p>No cases match the selected activity filters.</p>
        <button className="filter-clear" onClick={clearFilter} style={{ color: theme === "dark" ? "#f5c977" : "#9c5e0a" }}>
          Clear filters
        </button>
      </div>
    );
  }

  return (
    <div className={`pm-root theme-${theme}`}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

          --amber: #e8a23a;
          --amber-soft: #f5c977;
          --teal: #2dd4bf;
          --green: #34d399;

          --edge-dim: #3b4a63;

          --type-exception-fill: #2e2410; --type-exception-stroke: #d9a13a; --type-exception-text: #f5c977;
          --type-endbad-fill: #301620; --type-endbad-stroke: #e0607c; --type-endbad-text: #f6a3b6;
          --type-endgood-fill: #0f2b1c; --type-endgood-stroke: #34d399; --type-endgood-text: #7bf0bb;

        .pm-tab:hover { color: var(--text); }
        .pm-tab.active { background: var(--panel); color: var(--amber-soft); box-shadow: 0 0 0 1px var(--border); }

        .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 24px; }
        .kpi-card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; }
        .kpi-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin-bottom: 8px; }
        .kpi-value { font-family: var(--display); font-size: 26px; font-weight: 700; }
        .kpi-sub { font-size: 11.5px; color: var(--muted); margin-top: 4px; font-family: var(--mono); }

        .panel-grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 18px; }
        @media (max-width: 900px) { .panel-grid { grid-template-columns: 1fr; } }
        .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 20px 22px; }
        .panel h3 { font-family: var(--display); font-size: 15px; margin: 0 0 4px; }
        .panel .panel-sub { color: var(--muted); font-size: 12px; margin: 0 0 16px; }

        .freq-list { display: flex; flex-direction: column; gap: 10px; }
        .freq-row { display: grid; grid-template-columns: 128px 1fr 34px; align-items: center; gap: 10px; }
        .freq-name { font-size: 12px; }
        .freq-track { height: 8px; background: var(--panel-2); border-radius: 4px; overflow: hidden; border: 1px solid var(--border); }
        .freq-fill { height: 100%; background: linear-gradient(90deg, var(--teal), var(--amber)); }
        .freq-count { font-size: 12px; text-align: right; color: var(--muted); }

        .type-start { color: var(--teal); }
        .type-normal { color: var(--text); }
        .type-exception { color: var(--amber-soft); }
        .type-end-bad { color: var(--red); }
        .type-end-good { color: var(--green); }

        .map-scroll { overflow-x: auto; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 8px; }
        .map-svg { display: block; }
        .map-legend { display: flex; gap: 18px; flex-wrap: wrap; margin: 14px 0 12px; font-size: 12px; color: var(--muted); align-items: center; }
        .map-legend span { display: inline-flex; align-items: center; gap: 6px; }
        .legend-dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

        .metric-toggle { display: inline-flex; gap: 3px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 9px; padding: 3px; }
        .metric-toggle button { font-family: var(--body); font-weight: 600; font-size: 12px; padding: 7px 13px; border-radius: 6px; cursor: pointer; color: var(--muted); border: none; background: transparent; transition: all 0.15s ease; }
        .metric-toggle button:hover { color: var(--text); }
        .metric-toggle button.active { background: var(--panel); color: var(--amber-soft); box-shadow: 0 0 0 1px var(--border); }

        .variants-toolbar { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 4px; flex-wrap: wrap; }
        .variant-map { padding: 0 16px 16px; }

        .variants-list { display: flex; flex-direction: column; gap: 8px; }
        .variant-row { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
        .variant-head { display: grid; grid-template-columns: 34px 1fr 70px 44px 64px 18px; align-items: center; gap: 12px; padding: 12px 16px; cursor: pointer; }
        .variant-head:hover { background: var(--panel-2); }
        .variant-rank { font-family: var(--mono); color: var(--muted); font-size: 12px; }
        .variant-bar-track { height: 9px; background: var(--panel-2); border-radius: 5px; border: 1px solid var(--border); overflow: hidden; }
        .variant-bar-fill { height: 100%; background: linear-gradient(90deg, var(--teal), var(--amber)); }
        .variant-count { font-family: var(--mono); font-size: 12px; color: var(--text); }
        .variant-pct { font-family: var(--mono); font-size: 12px; color: var(--amber-soft); }
        .variant-steps-count { font-size: 11px; color: var(--muted); }
        .chevron { color: var(--muted); text-align: center; }
        .variant-trace { padding: 4px 16px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; border-top: 1px solid var(--border); padding-top: 12px; }
        .trace-chip { font-size: 11.5px; padding: 4px 9px; border-radius: 6px; background: var(--panel-2); border: 1px solid var(--border); font-family: var(--body); font-weight: 500; }
        .trace-chip.small { font-size: 11px; padding: 3px 8px; }
        .trace-arrow { color: var(--muted); font-size: 12px; }

        .log-wrap { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 18px 20px; }
        .log-toolbar { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
        .log-search { flex: 1; max-width: 320px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px; color: var(--text); font-family: var(--body); font-size: 13px; outline: none; }
        .log-search:focus { border-color: var(--amber); }
        .log-export { background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 9px 14px; color: var(--amber-soft); font-family: var(--body); font-weight: 600; font-size: 12.5px; cursor: pointer; }
        .log-export:hover { border-color: var(--amber); }
        .log-table-scroll { max-height: 520px; overflow-y: auto; border: 1px solid var(--border); border-radius: 10px; }
        .log-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
        .log-table thead th { position: sticky; top: 0; background: var(--panel-2); text-align: left; padding: 10px 14px; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; border-bottom: 1px solid var(--border); }
        .log-table td { padding: 8px 14px; border-bottom: 1px solid var(--border); }
        .log-table tbody tr:hover { background: var(--panel-2); }
        .mono { font-family: var(--mono); }
        .dim { color: var(--muted); }
        .log-footnote { margin-top: 10px; font-size: 11.5px; color: var(--muted); font-family: var(--mono); }

        .filter-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 20px; padding: 13px 16px; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; }
        .filter-bar-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-right: 4px; }
        .filter-chip { font-family: var(--body); font-size: 11.5px; font-weight: 500; padding: 5px 11px; border-radius: 999px; cursor: pointer; background: var(--panel-2); border: 1px solid var(--border); color: var(--muted); transition: all 0.15s ease; }
        .filter-chip:hover { color: var(--text); border-color: var(--muted); }
        .filter-chip.active { background: var(--amber); border-color: var(--amber); color: #1a1206; font-weight: 700; }
        .filter-summary { margin-left: auto; font-size: 11.5px; color: var(--muted); font-family: var(--mono); display: flex; align-items: center; gap: 10px; }
        .filter-clear { font-family: var(--body); font-size: 11.5px; font-weight: 600; color: var(--red); background: transparent; border: none; cursor: pointer; padding: 0; }
        .filter-clear:hover { text-decoration: underline; }

        .play-toggle { display: inline-flex; align-items: center; gap: 7px; font-family: var(--body); font-weight: 600; font-size: 12px; padding: 8px 14px; border-radius: 9px; cursor: pointer; color: var(--muted); border: 1px solid var(--border); background: var(--panel-2); transition: all 0.15s ease; }
        .play-toggle:hover { color: var(--text); }
        .play-toggle.on { color: var(--amber-soft); border-color: var(--amber); }
        .map-toolbar { margin-bottom: 14px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

        .case-viewer { display: grid; grid-template-columns: 250px 1fr; gap: 16px; align-items: start; }
        @media (max-width: 800px) { .case-viewer { grid-template-columns: 1fr; } }
        .case-list-panel { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 14px; }
        .case-list-search { width: 100%; background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 8px 11px; color: var(--text); font-family: var(--body); font-size: 12.5px; outline: none; margin-bottom: 10px; }
        .case-list-search:focus { border-color: var(--amber); }
        .case-list { max-height: 560px; overflow-y: auto; display: flex; flex-direction: column; gap: 3px; }
        .case-list-item { text-align: left; font-family: var(--mono); font-size: 12px; padding: 8px 10px; border-radius: 7px; background: transparent; border: none; color: var(--muted); cursor: pointer; display: flex; justify-content: space-between; }
        .case-list-item:hover { background: var(--panel-2); color: var(--text); }
        .case-list-item.active { background: var(--panel-2); color: var(--amber-soft); box-shadow: inset 2px 0 0 var(--amber); }
        .case-detail { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 20px 22px; }
        .case-detail-head { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 14px; margin-bottom: 18px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
        .case-detail-head h3 { font-family: var(--display); font-size: 18px; margin: 0 0 6px; }
        .case-variant-badge { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
        .case-kpis { display: flex; gap: 20px; font-family: var(--mono); }
        .case-kpis div { text-align: right; }
        .case-kpis .n { font-size: 16px; font-weight: 600; color: var(--amber-soft); display: block; }
        .case-kpis .l { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
        .case-timeline { display: flex; flex-direction: column; }
        .tl-row { display: flex; gap: 13px; align-items: flex-start; }
        .tl-dot { width: 13px; height: 13px; border-radius: 50%; margin-top: 5px; flex-shrink: 0; box-shadow: 0 0 0 3px var(--panel); }
        .tl-content { flex: 1; padding-bottom: 2px; }
        .tl-activity { font-size: 13.5px; font-weight: 600; }
        .tl-meta { font-size: 11.5px; color: var(--muted); font-family: var(--mono); margin-top: 2px; }
        .tl-gap { margin-left: 6px; padding-left: 24px; border-left: 1px dashed var(--border); font-size: 11px; color: var(--muted); font-family: var(--mono); padding-top: 4px; padding-bottom: 4px; }
        .empty-state { color: var(--muted); font-size: 13px; padding: 40px 0; text-align: center; }

        .datasource-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 16px; padding: 12px 16px; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; position: relative; }
        .datasource-info { display: flex; align-items: center; gap: 8px; }
        .datasource-label { font-family: var(--mono); font-size: 12px; color: var(--text); }
        .datasource-actions { display: flex; gap: 10px; margin-left: auto; }
        .file-btn { font-family: var(--body); font-weight: 600; font-size: 12.5px; padding: 8px 14px; border-radius: 9px; cursor: pointer; color: var(--amber-soft); border: 1px solid var(--amber); background: var(--panel-2); }
        .file-btn:hover { background: var(--panel); }
        .datasource-warning { flex-basis: 100%; font-size: 12px; color: var(--amber-soft); font-family: var(--mono); }
        .datasource-error { flex-basis: 100%; font-size: 12px; color: var(--red); font-family: var(--mono); }
      `}</style>

      <div className="pm-header">
        <div className="pm-title-block">
          <div className="eyebrow">Process Mining{dataSource === "custom" ? " · Custom Log" : " · Order-to-Cash"}</div>
          <h1>{dataSource === "custom" ? "Event Log Explorer" : "Order Fulfillment Process Explorer"}</h1>
          <p>
            {dataSource === "custom"
              ? `${fileName} replayed as an event log — directly-follows graph, variant breakdown, and raw trace inspection.`
              : "100 simulated orders replayed as an event log — directly-follows graph, variant breakdown, and raw trace inspection."}
          </p>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 22 }}>
          <div className="pm-header-stats">
            <div><span className="n">{analysis.totalCases}</span><span className="l">Cases</span></div>
            <div><span className="n">{analysis.totalEvents}</span><span className="l">Events</span></div>
            <div><span className="n">{analysis.variants.length}</span><span className="l">Variants</span></div>
          </div>
          <ThemeToggle theme={theme} setTheme={setTheme} />
        </div>
      </div>

      <div className="pm-tabs">
        {tabs.map((t) => (
          <button key={t.id} className={`pm-tab ${tab === t.id ? "active" : ""}`} onClick={() => setTab(t.id)}>
            {t.label}
          </button>
        ))}
      </div>

      {dataSourceBar}

      <ActivityFilterBar
        allActivities={allActivities}
        activityFilter={activityFilter}
        toggleActivity={toggleActivity}
        clearFilter={clearFilter}
        matchCount={filteredCases.length}
        totalCount={cases.length}
      />

      {tab === "overview" && (
        <>
          <div className="kpi-grid">
            <KpiCard label="Completion rate" value={`${analysis.completionRate.toFixed(0)}%`} sub="reached a positive end" accent="var(--green)" />
            <KpiCard label="Exception rate" value={`${analysis.exceptionRate.toFixed(0)}%`} sub="reached a negative end" accent="var(--red)" />
            <KpiCard label="Avg case duration" value={`${(analysis.avgDuration / 24).toFixed(1)}d`} sub={`${analysis.avgDuration.toFixed(0)} hours`} />
            <KpiCard label="Avg events / case" value={analysis.avgEvents.toFixed(1)} sub="activity steps" />
            <KpiCard label="Top variant share" value={`${((analysis.variants[0].count / analysis.totalCases) * 100).toFixed(0)}%`} sub={`${analysis.variants[0].count} of ${analysis.totalCases} cases`} accent="var(--amber-soft)" />
          </div>
          <div className="panel-grid">
            <div className="panel">
              <h3>Happy path</h3>
              <p className="panel-sub">Most frequent end-to-end variant in the log</p>
              <div className="variant-trace" style={{ borderTop: "none", paddingTop: 0 }}>
                {analysis.variants[0].steps.map((s, j) => (
                  <React.Fragment key={j}>
                    <span className={`trace-chip type-${activeMeta[s].type}`}>{s}</span>
                    {j < analysis.variants[0].steps.length - 1 && <span className="trace-arrow">→</span>}
                  </React.Fragment>
                ))}
              </div>
            </div>
            <div className="panel">
              <h3>Activity frequency</h3>
              <p className="panel-sub">Instances per activity across all cases</p>
              <ActivityFrequency analysis={analysis} meta={activeMeta} />
            </div>
          </div>
        </>
      )}

      {tab === "map" && (
        <>
          <div className="map-legend">
            <span><i className="legend-dot" style={{ background: "var(--type-start-stroke)" }} /> Start</span>
            <span><i className="legend-dot" style={{ background: "var(--type-normal-stroke)" }} /> Standard activity</span>
            <span><i className="legend-dot" style={{ background: "var(--type-exception-stroke)" }} /> Exception / rework</span>
            <span><i className="legend-dot" style={{ background: "var(--type-endbad-stroke)" }} /> Negative end</span>
            <span><i className="legend-dot" style={{ background: "var(--type-endgood-stroke)" }} /> Positive end</span>
            <span style={{ marginLeft: "auto" }}>
              {mapMetric === "count"
                ? "Edge thickness & label = transition frequency"
                : "Edge thickness, color & label = average transition duration"}{" "}
              · click a node to isolate its flows
            </span>
          </div>
          <div className="map-toolbar">
            <PlayToggle animate={animate} setAnimate={setAnimate} />
            <MetricToggle metric={mapMetric} setMetric={setMapMetric} />
          </div>
          <ProcessMap
            meta={activeMeta}
            layout={layout}
            nodeFreq={analysis.nodeFreq}
            edgeFreq={analysis.edgeFreq}
            nodeAvgDur={analysis.nodeAvgDur}
            edgeAvgDur={analysis.edgeAvgDur}
            metric={mapMetric}
            selected={selectedNode}
            setSelected={setSelectedNode}
            animate={animate}
          />
        </>
      )}

      {tab === "variants" && (
        <VariantsView
          analysis={analysis}
          meta={activeMeta}
          layout={layout}
          mapMetric={mapMetric}
          setMapMetric={setMapMetric}
          animate={animate}
          setAnimate={setAnimate}
        />
      )}

      {tab === "cases" && <CaseViewerView cases={filteredCases} analysis={analysis} meta={activeMeta} />}

      {tab === "log" && <EventLogView cases={filteredCases} meta={activeMeta} />}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<ProcessMiningExplorer />);
</script>

<script>
  var source = document.getElementById("app-source").textContent;
  var compiled = Babel.transform(source, {
    presets: [["react", { runtime: "classic" }]],
  }).code;
  var scriptEl = document.createElement("script");
  scriptEl.text = compiled;
  document.body.appendChild(scriptEl);
</script>
</body>
</html>
